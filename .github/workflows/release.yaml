concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm build
      - name: Release
        working-directory: packages/vendor-src
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # release-it-action recovery: publish tagged-but-unpublished versions via OIDC
        run: pnpm exec release-it --ci --verbose

name: Release

on:
  push:
    branches:
      - main
